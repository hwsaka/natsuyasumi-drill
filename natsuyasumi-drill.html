<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>なつやすみ まいにちドリル</title>
<link rel="manifest" href="./manifest-natsu.json">
<meta name="theme-color" content="#2C3B4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="毎日ドリル">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EC;
    --paper-line:#E4DCC6;
    --ink:#2C3B4E;
    --ink-soft:#5B6B7C;
    --kokugo:#D6534A;
    --kokugo-soft:#F7DEDB;
    --sansu:#2A7F8E;
    --sansu-soft:#DCEEEF;
    --rika:#4C8C4A;
    --rika-soft:#DFEEDD;
    --shakai:#B8823E;
    --shakai-soft:#F3E6D2;
    --stamp-red:#C8352C;
    --paper-fold:#F0E9D6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 33px, var(--paper-line) 34px),
      var(--paper);
    font-family:"Zen Maru Gothic", sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 18px 40px;}

  header{
    text-align:center;
    padding:18px 0 8px;
  }
  header h1{
    font-family:"Yomogi", cursive;
    font-size:2.3em;
    margin:0;
    color:var(--ink);
    letter-spacing:.02em;
  }
  header .sub{
    font-size:.9em;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:14px 0;
    flex-wrap:wrap;
  }
  .tab-group{display:flex;gap:8px;background:var(--paper-fold);padding:6px;border-radius:14px;}
  .tab-btn{
    border:none;
    padding:9px 18px;
    border-radius:10px;
    font-family:"Zen Maru Gothic";
    font-weight:700;
    font-size:.98em;
    cursor:pointer;
    background:transparent;
    color:var(--ink-soft);
    transition:all .15s;
  }
  .tab-btn.active.grade{background:var(--ink);color:#fff;}
  .tab-btn.active.kokugo{background:var(--kokugo);color:#fff;}
  .tab-btn.active.sansu{background:var(--sansu);color:#fff;}
  .tab-btn.active.rika{background:var(--rika);color:#fff;}
  .tab-btn.active.shakai{background:var(--shakai);color:#fff;}
  .tab-btn:hover:not(.active){background:#ffffff88;}
  .tab-btn:disabled{opacity:.35;cursor:default;}

  .date-row{
    text-align:center;
    font-size:.92em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .date-row input[type=date]{
    font-family:"Zen Maru Gothic";
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:4px 8px;
    background:#fff;
    color:var(--ink);
  }
  .today-btn{
    border:1px solid var(--paper-line);
    background:#fff;
    border-radius:8px;
    padding:4px 10px;
    font-family:"Zen Maru Gothic";
    font-size:.85em;
    cursor:pointer;
    color:var(--ink-soft);
  }

  .stats{
    text-align:center;
    font-size:.85em;
    color:var(--ink-soft);
    margin-bottom:18px;
  }

  .qlist{display:flex;flex-direction:column;gap:12px;}
  .qcard{
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 2px 0 var(--paper-line);
    display:flex;
    flex-direction:column;
    gap:10px;
    border-left:6px solid var(--subject-color, var(--sansu));
  }
  .qcard-top{display:flex;align-items:flex-start;gap:12px;}
  .qnum{
    font-family:"Yomogi";
    font-size:1.3em;
    width:28px;
    text-align:center;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .qbody{flex:1;min-width:0;}
  .qlabel{
    display:inline-block;
    font-size:.72em;
    font-weight:700;
    color:#fff;
    background:var(--subject-color, var(--sansu));
    padding:1px 8px;
    border-radius:6px;
    margin-bottom:5px;
  }
  .qprompt{font-size:1.05em;line-height:1.5;}
  .qprompt b{color:var(--subject-color, var(--sansu));}
  .mc-options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-left:40px;
  }
  .opt-btn{
    display:flex;
    align-items:center;
    gap:6px;
    border:2px solid var(--paper-line);
    background:#FFFDF6;
    border-radius:10px;
    padding:8px 12px;
    font-family:"Zen Maru Gothic";
    font-size:1em;
    font-weight:700;
    cursor:pointer;
    color:var(--ink);
    transition:all .12s;
  }
  .opt-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--paper-fold);
    font-size:.8em;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .opt-btn:hover:not([disabled]){border-color:var(--subject-color, var(--sansu));}
  .opt-btn.selected{border-color:var(--subject-color, var(--sansu));background:var(--subject-color, var(--sansu));color:#fff;}
  .opt-btn.selected .opt-num{background:rgba(255,255,255,.35);color:#fff;}
  .opt-btn.correct{border-color:var(--stamp-red);background:#FFF3F1;color:var(--stamp-red);}
  .opt-btn.wrong-selected{border-color:#9AA5AF;background:#F3F3F1;color:#7a848c;text-decoration:line-through;}
  .opt-btn[disabled]{cursor:default;}
  .mark{font-size:1.6em;font-weight:900;width:34px;text-align:center;font-family:"Yomogi";flex-shrink:0;}
  .mark.correct{color:var(--stamp-red);}
  .mark.wrong{color:#9AA5AF;}
  .correct-answer{font-size:.8em;color:var(--stamp-red);margin-top:2px;margin-left:40px;}

  .qcard.checked.is-correct{background:#FFF7F3;}
  .qcard.checked.is-wrong{background:#F6F7F4;}

  footer{
    max-width:760px;margin:26px auto 0;padding:0 18px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .check-btn{
    font-family:"Yomogi";
    font-size:1.3em;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:12px 40px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 3px 0 #1a2532;
  }
  .check-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1a2532;}
  .check-btn:disabled{background:#c8c8c8;box-shadow:none;cursor:default;}

  .result{
    position:relative;
    text-align:center;
    font-family:"Yomogi";
    font-size:1.6em;
    color:var(--ink);
    opacity:0;
    transform:scale(.7) rotate(-6deg);
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
  }
  .result.show{opacity:1;transform:scale(1) rotate(-4deg);}
  .stamp{
    display:inline-block;
    border:4px solid var(--stamp-red);
    color:var(--stamp-red);
    border-radius:50%;
    padding:14px 22px;
    line-height:1.1;
  }
  .back-btn{
    display:inline-block;
    margin-top:16px;
    font-family:"Zen Maru Gothic";
    font-weight:700;
    font-size:.62em;
    text-decoration:none;
    color:var(--ink);
    background:#fff;
    border:2px solid var(--paper-line);
    border-radius:20px;
    padding:8px 20px;
  }
  .back-btn:hover{border-color:var(--ink);}

  @media (max-width:520px){
    .mc-options{margin-left:0;}
    header h1{font-size:1.7em;}
  }

  /* スマホを横向きにしたとき（高さが低い画面）はヘッダーをコンパクトにする */
  @media (max-height:480px) and (orientation:landscape){
    header{padding:8px 0 4px;}
    header h1{font-size:1.4em;}
    header .sub{display:none;}
    .tabs{margin:8px 0;}
    .tab-btn{padding:6px 12px;font-size:.9em;}
    .stats{margin-bottom:10px;}
    .qcard{padding:10px 12px;}
    footer{margin-top:16px;}
  }
  @media (max-width:900px) and (orientation:landscape){
    .wrap{padding-left:24px;padding-right:24px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>なつやすみ まいにちドリル</h1>
    <div class="sub">1にち 20もん・5この こたえから えらんで、さいごに こたえあわせ！</div>
  </header>

  <div class="tabs">
    <div class="tab-group">
      <button class="tab-btn grade active" data-grade="2">2年生</button>
      <button class="tab-btn grade" data-grade="4">4年生</button>
    </div>
    <div class="tab-group">
      <button class="tab-btn kokugo active" data-subject="kokugo">こくご</button>
      <button class="tab-btn sansu" data-subject="sansu">さんすう</button>
      <button class="tab-btn rika" data-subject="rika">りか</button>
      <button class="tab-btn shakai" data-subject="shakai">しゃかい</button>
    </div>
  </div>

  <div class="date-row">
    <span id="dateLabel"></span>
    <input type="date" id="datePicker">
    <button class="today-btn" id="todayBtn">きょう</button>
  </div>
  <div class="stats" id="stats"></div>

  <div class="qlist" id="qlist"></div>

  <footer>
    <button class="check-btn" id="checkBtn">こたえあわせ</button>
    <div class="result" id="result"></div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- seeded random ----------
  function cyrb53(str){
    let h1=0xdeadbeef^0, h2=0x41c6ce57^0;
    for(let i=0;i<str.length;i++){
      const ch=str.charCodeAt(i);
      h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);
    }
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return 4294967296*(2097151&h2)+(h1>>>0);
  }
  function mulberry32(seed){
    let a=seed>>>0;
    return function(){
      a|=0; a=a+0x6D2B79F5|0;
      let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }
  function makeRng(dateStr,grade,subject){
    return mulberry32(cyrb53(dateStr+"|"+grade+"|"+subject));
  }
  function randInt(rng,min,max){ return Math.floor(rng()*(max-min+1))+min; }
  function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
  function shuffle(rng,arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(rng()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function daysSinceEpoch(dateStr){
    return Math.floor(new Date(dateStr+"T00:00:00Z").getTime()/86400000);
  }
  function zenkakuToHan(s){
    return s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  }
  function norm(s){
    return zenkakuToHan(String(s||"")).trim().replace(/\s+/g,"");
  }

  // ---------- 5択の選択肢づくり ----------
  function numericDistractors(rng, correctStr){
    const n = parseInt(correctStr,10);
    const used = new Set([n]);
    const offsets = shuffle(rng, [1,-1,2,-2,3,-3,5,-5,9,-9,10,-10,11,-11]);
    const result = [];
    for(const off of offsets){
      const cand = n+off;
      if(cand>=0 && !used.has(cand)){
        used.add(cand); result.push(String(cand));
        if(result.length>=4) break;
      }
    }
    let extra=12;
    while(result.length<4){
      const cand=n+extra;
      if(!used.has(cand)){ used.add(cand); result.push(String(cand)); }
      extra++;
    }
    return result;
  }
  function remainderDistractors(rng, correctStr){
    const m = correctStr.match(/^(\d+)あまり(\d+)$/);
    if(!m) return numericDistractors(rng, correctStr);
    const q = parseInt(m[1],10), r = parseInt(m[2],10);
    const used = new Set([correctStr]);
    const result = [];
    for(const off of shuffle(rng,[1,-1,2,-2])){
      const nq=q+off;
      if(nq>=0){
        const s=`${nq}あまり${r}`;
        if(!used.has(s)){ used.add(s); result.push(s); if(result.length>=2) break; }
      }
    }
    for(const off of shuffle(rng,[1,-1,2,-2])){
      if(result.length>=4) break;
      const nr=r+off;
      if(nr>=0){
        const s=`${q}あまり${nr}`;
        if(!used.has(s)){ used.add(s); result.push(s); }
      }
    }
    let extra=3;
    while(result.length<4){
      const s=`${q+extra}あまり${r}`;
      if(!used.has(s)){ used.add(s); result.push(s); }
      extra++;
    }
    return result.slice(0,4);
  }
  function buildChoicesForMath(rng, q){
    const distractors = /あまり/.test(q.answer) ? remainderDistractors(rng,q.answer) : numericDistractors(rng,q.answer);
    const options = shuffle(rng, [q.answer, ...distractors]);
    return {options, correctIndex: options.indexOf(q.answer)};
  }
  function buildChoicesForKokugo(rng, pool, item){
    const sameType = pool.filter(p => p.type===item.type && norm(p.answer)!==norm(item.answer));
    const seen = new Set([norm(item.answer)]);
    const candidates = [];
    for(const p of shuffle(rng, sameType)){
      const key = norm(p.answer);
      if(!seen.has(key)){
        seen.add(key); candidates.push(p.answer);
        if(candidates.length>=4) break;
      }
    }
    let filler=1;
    while(candidates.length<4){ candidates.push(item.answer+"　"+filler); filler++; }
    const options = shuffle(rng, [item.answer, ...candidates]);
    return {options, correctIndex: options.indexOf(item.answer)};
  }

  // ---------- math generators ----------
  // 2年生 1学期の範囲：くり上がり・くり下がりのたし算/ひき算の筆算、100より大きい数、長さ。
  // 九九（かけ算）は多くの学校で2学期以降のため、ここには含めていません。
  const mathGensGrade2 = [
    rng=>{ const a=randInt(rng,10,89), b=randInt(rng,1,9);
      return {label:"たしざん", prompt:`${a} ＋ ${b} ＝`, answer:String(a+b)}; },
    rng=>{ const a=randInt(rng,10,69), b=randInt(rng,10,29);
      return {label:"たしざん（くり上がり）", prompt:`${a} ＋ ${b} ＝`, answer:String(a+b)}; },
    rng=>{ const a=randInt(rng,100,500), b=randInt(rng,10,99);
      return {label:"大きい数のたしざん", prompt:`${a} ＋ ${b} ＝`, answer:String(a+b)}; },
    rng=>{ const a=randInt(rng,11,99), b=randInt(rng,1,9);
      return {label:"ひきざん", prompt:`${a} － ${b} ＝`, answer:String(a-b)}; },
    rng=>{ const a=randInt(rng,30,99); const b=randInt(rng,10,Math.min(a-1,29));
      return {label:"ひきざん（くり下がり）", prompt:`${a} － ${b} ＝`, answer:String(a-b)}; },
    rng=>{ const a=randInt(rng,3,18), b=randInt(rng,3,18);
      return {label:"文しょうだい", prompt:`赤い花が ${a}本、白い花が ${b}本 さいています。あわせて なん本ですか。`, answer:String(a+b)}; },
    rng=>{ const a=randInt(rng,10,30), b=randInt(rng,1,Math.min(9,a-1));
      return {label:"文しょうだい", prompt:`いろがみが ${a}まい ありました。${b}まい つかいました。のこりは なんまいですか。`, answer:String(a-b)}; },
    rng=>{ const a=randInt(rng,15,45); const b=randInt(rng,1,a-1);
      return {label:"文しょうだい（長さ）", prompt:`テープが ${a}cm ありました。${b}cm 切りとりました。のこりは 何cmですか。`, answer:String(a-b)}; },
    rng=>{ const a=randInt(rng,20,60); const b=randInt(rng,5,Math.min(35,a-1));
      return {label:"文しょうだい", prompt:`バスに ${a}人 のっていました。バスていで ${b}人 おりました。のこりは なん人ですか。`, answer:String(a-b)}; },
  ];

  // 4年生 1学期の範囲：大きい数、角度、かけ算の筆算（復習）、わり算の筆算（1けた・2けたでわる）。
  // 小数のかけ算・わり算や分数の計算は多くの学校で2学期以降のため、ここには含めていません。
  const mathGensGrade4 = [
    rng=>{ const a=randInt(rng,12,98), b=randInt(rng,2,9);
      return {label:"かけざんの筆算", prompt:`${a} × ${b} ＝`, answer:String(a*b)}; },
    rng=>{ const a=randInt(rng,102,998), b=randInt(rng,2,9);
      return {label:"かけざんの筆算", prompt:`${a} × ${b} ＝`, answer:String(a*b)}; },
    rng=>{ const a=randInt(rng,12,89), b=randInt(rng,11,19);
      return {label:"かけざんの筆算（2けた×2けた）", prompt:`${a} × ${b} ＝`, answer:String(a*b)}; },
    rng=>{ const b=randInt(rng,2,9); const q=randInt(rng,2,20); const a=b*q;
      return {label:"わり算の筆算（1けたでわる）", prompt:`${a} ÷ ${b} ＝`, answer:String(q)}; },
    rng=>{ const b=randInt(rng,2,9); const q=randInt(rng,2,15); const r=randInt(rng,1,b-1); const a=b*q+r;
      return {label:"わり算の筆算（あまりあり）", prompt:`${a} ÷ ${b} ＝ 　あまり`, answer:`${q}あまり${r}`}; },
    rng=>{ const b=randInt(rng,11,19); const q=randInt(rng,2,9); const a=b*q;
      return {label:"わり算の筆算（2けたでわる）", prompt:`${a} ÷ ${b} ＝`, answer:String(q)}; },
    rng=>{ const a=randInt(rng,10,150), b=randInt(rng,10,Math.max(10,170-a));
      return {label:"角度のたしざん", prompt:`${a}° と ${b}° を あわせると 何度ですか。`, answer:String(a+b)}; },
    rng=>{ const a=randInt(rng,1000,9000), b=randInt(rng,100,999);
      return {label:"大きい数のたしざん", prompt:`${a} ＋ ${b} ＝`, answer:String(a+b)}; },
    rng=>{ const a=randInt(rng,120,890), b=randInt(rng,2,9);
      return {label:"文しょうだい（かけ算）", prompt:`1はこに あめが ${b}こずつ 入っています。${a}はこ あると、あめは ぜんぶで なんこですか。`, answer:String(a*b)}; },
    rng=>{ const b=randInt(rng,3,8); const q=randInt(rng,4,25); const a=b*q;
      return {label:"文しょうだい（わり算）", prompt:`${a}まいの おり紙を、${b}人で 同じ数ずつ 分けます。1人分は なんまいですか。`, answer:String(q)}; },
    rng=>{ const a=randInt(rng,150,980), b=randInt(rng,120,a-1);
      return {label:"文しょうだい（ひき算）", prompt:`ある町の 人口は ${a}人です。となり町の 人口は ${b}人です。ちがいは なん人ですか。`, answer:String(a-b)}; },
  ];

  // ---------- kokugo pools ----------
  function readingQ(word,yomi,sentence,alt){
    return {type:"reading",label:"読み方",
      prompt:`つぎの文の　<b>${word}</b>　の読みかたを　ひらがなで　書きましょう。<br>「${sentence}」`,
      answer:yomi, alt:alt||[]};
  }
  function writingQ(yomi,kanji,alt){
    return {type:"writing",label:"かん字を書く",
      prompt:`つぎの「${yomi}」を　かん字で　書きましょう。`,
      answer:kanji, alt:alt||[]};
  }
  function oppositeQ(word,ans,alt){
    return {type:"vocab",label:"反対の意味の言葉",
      prompt:`「${word}」の　反対（はんたい）の意味の言葉を　書きましょう。`,
      answer:ans, alt:alt||[]};
  }

  const kokugoGrade2 = [
    readingQ("東西","とうざい","東西南北を　地図で　しらべる。"),
    readingQ("汽車","きしゃ","むかしは　汽車に　のって　旅をした。"),
    readingQ("兄弟","きょうだい","わたしには　兄弟が　二人　います。"),
    readingQ("教室","きょうしつ","教室で　べんきょうする。"),
    readingQ("近所","きんじょ","近所の　こうえんで　あそぶ。"),
    readingQ("計算","けいさん","算数の　計算問題を　とく。"),
    readingQ("午後","ごご","午後から　雨が　ふる。"),
    readingQ("公園","こうえん","公園で　ボールあそびを　した。"),

    mcQ("地図の基礎", "地図で、土地の高さが同じところを結んだ線を何といいますか。", ["等高線","緯線","経線","境界線"], "等高線"),
    mcQ("地図の基礎", "地図の上で、ふつう上の方はどの方角を指しますか。", ["北","南","東","西"], "北"),
    mcQ("地図の基礎", "地図で、実際のきょりを縮めて表した割合を何といいますか。", ["縮尺","等高線","方位","凡例"], "縮尺"),
    mcQ("都道府県", "都道府県のうち、「都」がつくのはどこですか。", ["東京都","大阪府","京都府","北海道"], "東京都"),
    mcQ("都道府県", "都道府県のうち、「道」がつくのはどこですか。", ["北海道","東京都","大阪府","京都府"], "北海道"),
    mcQ("都道府県", "近畿地方にふくまれる都道府県はどれですか。", ["京都府","福岡県","宮城県","静岡県"], "京都府"),
    mcQ("都道府県", "関東地方にふくまれない県はどれですか。", ["福岡県","埼玉県","千葉県","神奈川県"], "福岡県"),
    mcQ("福岡県のようす", "福岡県でとれる魚介類を使った加工品として全国的に有名なものはどれですか。", ["明太子","りんごジャム","かにみそ","ホタテ"], "明太子"),
    mcQ("福岡県のようす", "福岡県にある大きな空港はどれですか。", ["福岡空港","羽田空港","関西空港","新千歳空港"], "福岡空港"),
    mcQ("福岡県のようす", "博多どんたくや博多祇園山笠などのお祭りがさかんな都市はどこですか。", ["福岡市","北九州市","久留米市","大牟田市"], "福岡市"),
    mcQ("福岡県のようす", "福岡県は、九州地方の中でどのあたりに位置していますか。", ["北部","南部","西のはし","九州の外側"], "北部"),
    mcQ("ごみの処理", "新聞紙や古紙のように、資源ごみとして分別されることが多いものはどれですか。", ["新聞紙・古紙","生ごみ","われたガラス（危険物）","使い切ったスプレーかん"], "新聞紙・古紙"),
    mcQ("ごみの処理", "ごみをできるだけ出さないようにする取り組みを何といいますか。", ["ごみの減量","リサイクル","しょ理","回収"], "ごみの減量"),
    mcQ("ごみの処理", "3R（スリーアール）のうち、「使い終わったものをそのままの形でくり返し使う」ことを何といいますか。", ["リユース","リデュース","リサイクル","リフューズ"], "リユース"),
    mcQ("水とくらし", "ダムの主な役わりとして正しいものはどれですか。", ["水をたくわえ、こう水を防いだり生活用水を供給したりする","電気だけを作る","魚をとるため","船を通すためだけ"], "水をたくわえ、こう水を防いだり生活用水を供給したりする"),
    mcQ("水とくらし", "下水処理場のはたらきとして正しいものはどれですか。", ["よごれた水をきれいにしてから川や海に流す","水道の水をつくる","ごみを燃やす","電気をつくる"], "よごれた水をきれいにしてから川や海に流す"),
    mcQ("地図の基礎", "地図の中で、道路や建物などいろいろな種類を表すために使われる記号を何といいますか。", ["地図記号","等高線","縮尺","方位記号"], "地図記号"),
    mcQ("地図の基礎", "地図のすみなどに書かれている、地図記号の意味をまとめたものを何といいますか。", ["凡例","縮尺","等高線","方位"], "凡例"),
    mcQ("都道府県", "都道府県の中で、海に面していない「内陸県」はどれですか。", ["埼玉県","福岡県","千葉県","宮城県"], "埼玉県"),
    mcQ("都道府県", "九州地方にある県の数はいくつですか（沖縄県をふくむ）。", ["8","6","7","9"], "8"),
    mcQ("都道府県", "海に面していない8つの県のことを何といいますか。", ["内陸県","海岸県","半島県","島しょ県"], "内陸県"),
    mcQ("福岡県のようす", "福岡県で生産がさかんな果物として知られているものはどれですか。", ["いちご（あまおう）","りんご","さくらんぼ","みかん"], "いちご（あまおう）"),
    mcQ("ごみの処理", "都道府県や市区町村（地方公共団体）の仕事として正しいものはどれですか。", ["ごみの収集や道路の整備など住民の生活を支える","外国との貿易だけを行う","全国のニュースを作る","裁判を行う"], "ごみの収集や道路の整備など住民の生活を支える"),
    mcQ("水とくらし", "浄水場で行っていることとして正しくないものはどれですか。", ["石油をつくる","にごりを取りのぞく","消毒する","安全かどうか検査する"], "石油をつくる"),
    mcQ("ごみの処理", "しゅう集車が集めた「もえるごみ」は、主にどこに運ばれますか。", ["清掃工場","浄水場","下水処理場","市役所"], "清掃工場"),
    mcQ("地図の基礎", "地図で、北の反対の方角はどこですか。", ["南","東","西","北東"], "南"),
  ];
  const rikaShakaiPools = {rika:rikaGrade4, shakai:shakaiGrade4};

  const mathGens = {2:mathGensGrade2, 4:mathGensGrade4};

  // ---------- question builders ----------
  function buildMathQuestions(grade,dateStr){
    const rng = makeRng(dateStr,grade,"sansu");
    const gens = mathGens[grade];
    const qs=[];
    const seenPrompts = new Set(); // 同じ問題文が1日の中で重ならないようにする
    let guard=0;
    while(qs.length<20 && guard<500){
      guard++;
      const g = pick(rng,gens);
      const q = g(rng);
      if(seenPrompts.has(q.prompt)) continue; // 同じ問題が出たら作り直す
      seenPrompts.add(q.prompt);
      const {options, correctIndex} = buildChoicesForMath(rng, q);
      qs.push({label:q.label, prompt:q.prompt, answer:q.answer, options, correctIndex});
    }
    return qs;
  }

  // ---------- 日をまたいでも問題がかぶりにくい「シャッフルの束」方式 ----------
  // pool全体を出題数(20)ずつのまとまりに区切ってシャッフルし、1サイクルの間（pool内の全問を
  // 出し切るまでの日数）は同じ問題が2度出ないようにする。サイクルが一周したら、ちがう順番で
  // もう一度シャッフルして次のサイクルに入る。
  function selectFromPoolNoRepeat(pool, dateStr, grade, subjectKey){
    const perDay = 20;
    const daysPerCycle = Math.max(1, Math.ceil(pool.length/perDay));
    const dayIdx = daysSinceEpoch(dateStr);
    const cycleNum = Math.floor(dayIdx/daysPerCycle);
    const posInCycle = dayIdx%daysPerCycle;

    const deck = shuffle(makeRng("cyc"+cycleNum, grade, subjectKey), pool);
    let selected = deck.slice(posInCycle*perDay, posInCycle*perDay+perDay);

    if(selected.length<perDay){
      // サイクルの最後の日で問題数が足りないときは、同じサイクルの中からおぎなう
      // （次のサイクルの1日目から借りると、そこと丸かぶりしてしまうため）
      const priorItems = new Set(deck.slice(0, posInCycle*perDay));
      const have = new Set(selected);
      const fillRng = makeRng("cyc"+cycleNum+"-fill", grade, subjectKey);
      // まず、同じサイクルの他の日ともかぶらない候補から優先的に埋める
      const freshCandidates = shuffle(fillRng, pool.filter(item=>!have.has(item) && !priorItems.has(item)));
      for(const item of freshCandidates){
        if(selected.length>=perDay) break;
        selected.push(item); have.add(item);
      }
      // それでも足りない場合（プールがperDay×日数より小さいときなど）は、
      // 同じサイクルの中からやむを得ず再利用して必ず20問そろえる
      if(selected.length<perDay){
        const fallbackCandidates = shuffle(fillRng, pool.filter(item=>!have.has(item)));
        for(const item of fallbackCandidates){
          if(selected.length>=perDay) break;
          selected.push(item); have.add(item);
        }
      }
    }
    // 表示の並び順は日付ごとに変える
    return shuffle(makeRng(dateStr, grade, subjectKey+":order"), selected);
  }

  function buildKokugoQuestions(grade,dateStr){
    const pool = kokugoPools[grade];
    const selected = selectFromPoolNoRepeat(pool, dateStr, grade, "kokugo");
    const rng = makeRng(dateStr, grade, "kokugo:choices");
    return selected.map(item=>{
      const {options, correctIndex} = buildChoicesForKokugo(rng, pool, item);
      return {label:item.label, prompt:item.prompt, answer:item.answer, options, correctIndex};
    });
  }
  function buildFixedChoiceQuestions(pool, dateStr, subjectKey){
    const selected = selectFromPoolNoRepeat(pool, dateStr, 4, subjectKey);
    const rng = makeRng(dateStr, 4, subjectKey+":choices");
    return selected.map(q=>{
      const options = shuffle(rng, q.options);
      return {label:q.label, prompt:q.prompt, answer:q.answer, options, correctIndex: options.indexOf(q.answer)};
    });
  }
  function buildQuestions(grade,subject,dateStr){
    if(subject==="sansu") return buildMathQuestions(grade,dateStr);
    if(subject==="kokugo") return buildKokugoQuestions(grade,dateStr);
    if(subject==="rika") return buildFixedChoiceQuestions(rikaShakaiPools.rika, dateStr, "rika");
    if(subject==="shakai") return buildFixedChoiceQuestions(rikaShakaiPools.shakai, dateStr, "shakai");
  }

  // ---------- state ----------
  let state = { grade:2, subject:"kokugo", date: todayStr() };

  function todayStr(){
    const d=new Date();
    const tz = d.getTimezoneOffset();
    const local = new Date(d.getTime()-tz*60000);
    return local.toISOString().slice(0,10);
  }

  // ---------- storage ----------
  async function loadRecord(){
    const key = `record:${state.grade}:${state.subject}:${state.date}`;
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  async function saveRecord(rec){
    const key = `record:${state.grade}:${state.subject}:${state.date}`;
    try{ localStorage.setItem(key, JSON.stringify(rec)); }catch(e){ console.error(e); }
  }
  async function countCompleted(){
    try{
      const prefix = `record:${state.grade}:${state.subject}:`;
      let count = 0;
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix)) count++;
      }
      return count;
    }catch(e){ return 0; }
  }

  // ---------- rendering ----------
  let currentQuestions = [];
  let selections = {};

  function subjColor(){
    if(state.subject==="kokugo") return "var(--kokugo)";
    if(state.subject==="rika") return "var(--rika)";
    if(state.subject==="shakai") return "var(--shakai)";
    return "var(--sansu)";
  }
  function subjJaLabel(subject){
    if(subject==="kokugo") return "こくご";
    if(subject==="rika") return "りか";
    if(subject==="shakai") return "しゃかい";
    return "さんすう";
  }

  async function render(){
    document.querySelectorAll(".tab-btn.grade").forEach(b=>b.classList.toggle("active", b.dataset.grade==String(state.grade)));
    const grade4Only = document.querySelectorAll(".tab-btn.rika,.tab-btn.shakai");
    grade4Only.forEach(b=>{ b.disabled = (state.grade!==4); });
    document.querySelectorAll(".tab-btn.kokugo,.tab-btn.sansu,.tab-btn.rika,.tab-btn.shakai").forEach(b=>b.classList.toggle("active", b.dataset.subject===state.subject));
    document.getElementById("datePicker").value = state.date;
    const dObj = new Date(state.date+"T00:00:00");
    const wd = ["日","月","火","水","木","金","土"][dObj.getDay()];
    document.getElementById("dateLabel").textContent = `${state.date}（${wd}）　${state.grade}年生・${subjJaLabel(state.subject)}`;

    currentQuestions = buildQuestions(state.grade, state.subject, state.date);
    selections = {};
    const list = document.getElementById("qlist");
    list.innerHTML = "";
    currentQuestions.forEach((q,i)=>{
      const card = document.createElement("div");
      card.className="qcard";
      card.style.setProperty("--subject-color", subjColor());
      card.dataset.idx=i;
      const optsHtml = q.options.map((opt,oi)=>`
          <button type="button" class="opt-btn" data-idx="${i}" data-oi="${oi}">
            <span class="opt-num">${oi+1}</span><span>${opt}</span>
          </button>`).join("");
      card.innerHTML = `
        <div class="qcard-top">
          <div class="qnum">${i+1}</div>
          <div class="qbody">
            <span class="qlabel">${q.label}</span>
            <div class="qprompt">${q.prompt}</div>
          </div>
          <span class="mark"></span>
        </div>
        <div class="mc-options" data-idx="${i}">${optsHtml}</div>
        <div class="correct-answer" style="display:none;"></div>`;
      list.appendChild(card);
    });

    list.querySelectorAll(".opt-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = Number(btn.dataset.idx);
        if(btn.disabled) return;
        selections[i] = Number(btn.dataset.oi);
        list.querySelectorAll(`.opt-btn[data-idx="${i}"]`).forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    document.getElementById("result").className="result";
    document.getElementById("result").innerHTML="";
    document.getElementById("checkBtn").disabled=false;

    const rec = await loadRecord();
    if(rec && rec.selections){
      selections = {...rec.selections};
      Object.entries(selections).forEach(([i,oi])=>{
        const btn = list.querySelector(`.opt-btn[data-idx="${i}"][data-oi="${oi}"]`);
        if(btn) btn.classList.add("selected");
      });
      if(rec.checked){ applyGrading(rec.selections, rec.score); }
    }
    const n = await countCompleted();
    document.getElementById("stats").textContent = `これまで、この学年・教科で ${n}日ぶん がんばったよ！`;
  }

  function applyGrading(sel, score){
    const cards = document.querySelectorAll(".qcard");
    cards.forEach((card,i)=>{
      const q = currentQuestions[i];
      const chosen = sel[i];
      const r = chosen === q.correctIndex;
      card.classList.add("checked");
      card.classList.toggle("is-correct", r);
      card.classList.toggle("is-wrong", !r);
      const mark = card.querySelector(".mark");
      mark.textContent = r ? "○" : "✕";
      mark.className = "mark "+(r?"correct":"wrong");
      card.querySelectorAll(".opt-btn").forEach((btn,oi)=>{
        btn.disabled = true;
        if(oi===q.correctIndex) btn.classList.add("correct");
        else if(oi===chosen) btn.classList.add("wrong-selected");
      });
      const ansDiv = card.querySelector(".correct-answer");
      if(!r){
        ansDiv.style.display="block";
        ansDiv.textContent = `せいかい： ${q.answer}`;
      } else {
        ansDiv.style.display="none";
      }
    });
    showResult(score);
  }

  function showResult(score){
    const el = document.getElementById("result");
    let msg;
    if(score===20) msg = "ぜんもん せいかい！　すごい！";
    else if(score>=15) msg = "よくできました！";
    else if(score>=10) msg = "よくがんばったね！";
    else msg = "もういちど　やってみよう！";
    el.innerHTML = `<div class="stamp">${score}／ 20<br><span style="font-size:.55em;">${msg}</span></div><br><a class="back-btn" href="./index.html">トップへ もどる</a>`;
    requestAnimationFrame(()=>el.classList.add("show"));
  }

  async function handleCheck(){
    if(Object.keys(selections).length < currentQuestions.length){
      alert("まだ こたえを えらんでいない もんだいが あるよ。ぜんぶ えらんでから おしてね。");
      return;
    }
    let score=0;
    currentQuestions.forEach((q,i)=>{ if(selections[i]===q.correctIndex) score++; });
    applyGrading(selections, score);
    document.getElementById("checkBtn").disabled=true;
    await saveRecord({selections, score, checked:true, total:20});
    const n = await countCompleted();
    document.getElementById("stats").textContent = `これまで、この学年・教科で ${n}日ぶん がんばったよ！`;
  }

  // ---------- events ----------
  document.querySelectorAll(".tab-btn.grade").forEach(b=>{
    b.addEventListener("click",()=>{
      state.grade = Number(b.dataset.grade);
      if(state.grade===2 && (state.subject==="rika" || state.subject==="shakai")){
        state.subject = "kokugo";
      }
      render();
    });
  });
  document.querySelectorAll(".tab-btn.kokugo,.tab-btn.sansu,.tab-btn.rika,.tab-btn.shakai").forEach(b=>{
    b.addEventListener("click",()=>{
      if(b.disabled) return;
      state.subject = b.dataset.subject; render();
    });
  });
  document.getElementById("datePicker").addEventListener("change",(e)=>{
    if(e.target.value){ state.date = e.target.value; render(); }
  });
  document.getElementById("todayBtn").addEventListener("click",()=>{
    state.date = todayStr(); render();
  });
  document.getElementById("checkBtn").addEventListener("click", handleCheck);

  render();
})();
</script>
